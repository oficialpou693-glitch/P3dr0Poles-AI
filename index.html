<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P3dr0Poles Studios | AI</title>
  <style>
    /* =========================================
       CSS - ESTILO ULTRA-MINIMALISTA
       ========================================= */
    :root {
      --bg-color: #000000;
      --text-main: #ededed;
      --text-muted: #666666;
      --accent: #ffffff;
      --code-bg: #0a0a0a;
      --border-subtle: #1a1a1a;
      --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-stack);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Logo no fundo - Marca D'água sutil */
    .background-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.02; /* Quase invisível para manter o minimalismo */
      pointer-events: none;
      z-index: 0;
    }

    /* Contêiner Principal Sem Bordas Visíveis */
    .main-wrapper {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 1;
      padding: 0 20px;
    }

    /* Cabeçalho Limpo */
    header {
      padding: 40px 0 20px 0;
      text-align: center;
    }

    header h1 {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Área do Chat */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding-bottom: 40px;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar {
      width: 4px;
    }
    .chat-area::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 4px;
    }

    /* Linhas de Mensagem */
    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-role {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .message-content {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-main);
    }

    /* Estilização de Código Markdown */
    .message-content pre {
      background: var(--code-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 16px;
      margin: 16px 0;
      overflow-x: auto;
      position: relative;
    }

    .message-content code {
      font-family: var(--font-mono);
      font-size: 13px;
      color: #a8a8b1;
    }

    /* Código Inline */
    .message-content p > code {
      background: var(--border-subtle);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      color: var(--accent);
    }

    /* Botão de Copiar (Aparece no bloco de código) */
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #888;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font-stack);
      transition: all 0.2s;
    }
    .copy-btn:hover {
      background: #333;
      color: #fff;
    }

    /* Área de Input */
    .input-wrapper {
      padding: 20px 0 40px 0;
      background: linear-gradient(transparent, var(--bg-color) 20%);
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 4px 12px;
      transition: border-color 0.3s;
    }
    .input-box:focus-within {
      border-color: #444;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 15px;
      padding: 12px 0;
      resize: none;
      max-height: 200px;
      outline: none;
      font-family: var(--font-stack);
    }

    textarea::placeholder {
      color: #444;
    }

    button.send-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 12px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: color 0.2s;
    }

    button.send-btn:hover {
      color: var(--accent);
    }

    /* Status de Digitação */
    .typing-indicator {
      display: none;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      font-style: italic;
    }

  </style>
</head>
<body>

  <!-- Logo de Fundo (Deixe o link aqui) -->
  <div class="background-logo" id="brandLogo"></div>

  <div class="main-wrapper">
    <header>
      <h1>P3dr0Poles Studios</h1>
    </header>

    <div class="chat-area" id="chatArea">
      <!-- Mensagem Inicial -->
      <div class="message-row">
        <div class="message-role">Sistema</div>
        <div class="message-content">
          Engine conectada: <code>openai/gpt-oss-120b</code>.<br>
          Ambiente otimizado para Lua, C, C++, C# e Python. Aguardando instruções.
        </div>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-box">
        <textarea 
          id="userInput" 
          rows="1" 
          placeholder="Escreva sua lógica ou cole seu código..."
        ></textarea>
        <button class="send-btn" id="sendBtn">Enviar</button>
      </div>
      <div class="typing-indicator" id="typingStatus">Processando resposta...</div>
    </div>
  </div>

  <script>
    /* =========================================
       JAVASCRIPT - LÓGICA E API (Modo Raciocínio)
       ========================================= */

    // 1. CONFIGURAÇÕES
    const URL_DA_LOGO = ""; // Cole o link da sua imagem aqui
    const API_KEY_GROQ = "SUA_API_KEY_AQUI"; // Sua chave gsk_...
    const MODEL_NAME = "openai/gpt-oss-120b";
    
    const SYSTEM_PROMPT = `
      Você é a inteligência artificial central da P3dr0Poles Studios.
      Aja com extrema precisão, raciocínio lógico profundo e minimalismo.
      Seu foco absoluto é programação em Lua, C, C++, C# e Python.
      Forneça códigos limpos, performáticos e explique sua lógica de forma técnica e direta.
    `;

    // 2. ESTADO DA APLICAÇÃO
    let chatHistory = [
      { role: "system", content: SYSTEM_PROMPT.trim() }
    ];

    // 3. ELEMENTOS DO DOM
    const DOM = {
      logo: document.getElementById('brandLogo'),
      chatArea: document.getElementById('chatArea'),
      input: document.getElementById('userInput'),
      sendBtn: document.getElementById('sendBtn'),
      typing: document.getElementById('typingStatus')
    };

    // 4. INICIALIZAÇÃO
    function init() {
      if (URL_DA_LOGO) {
        DOM.logo.style.backgroundImage = `url('${URL_DA_LOGO}')`;
      }
      setupEventListeners();
    }

    function setupEventListeners() {
      // Auto-redimensionar o textarea conforme digita
      DOM.input.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
      });

      // Enviar com Enter (sem Shift)
      DOM.input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          processUserMessage();
        }
      });

      DOM.sendBtn.addEventListener('click', processUserMessage);

      // Delegação de evento para o botão de copiar gerado dinamicamente
      DOM.chatArea.addEventListener('click', function(e) {
        if (e.target.classList.contains('copy-btn')) {
          copyToClipboard(e.target);
        }
      });
    }

    // 5. LÓGICA DE MENSAGENS
    async function processUserMessage() {
      const text = DOM.input.value.trim();
      if (!text) return;

      // Resetar input
      DOM.input.value = '';
      DOM.input.style.height = 'auto';
      
      // Atualizar UI e Histórico
      renderMessage('Usuário', text);
      chatHistory.push({ role: "user", content: text });
      
      // Chamar API
      setTypingStatus(true);
      
      try {
        const responseText = await fetchFromGroq();
        chatHistory.push({ role: "assistant", content: responseText });
        renderMessage('P3dr0Poles AI', responseText, true);
      } catch (error) {
        console.error("Erro Crítico:", error);
        renderMessage('Sistema', 'Falha na requisição. Verifique a chave de API ou conexão.', true);
      } finally {
        setTypingStatus(false);
      }
    }

    // 6. COMUNICAÇÃO COM A API GROQ
    async function fetchFromGroq() {
      const payload = {
        model: MODEL_NAME,
        messages: chatHistory,
        temperature: 0.1, // Temperatura baixa = mais foco e precisão técnica
        max_tokens: 6000
      };

      const requestOptions = {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${API_KEY_GROQ}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      };

      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", requestOptions);
      
      if (!response.ok) {
        throw new Error(`HTTP Erro Status: ${response.status}`);
      }

      const data = await response.json();
      return data.choices[0].message.content;
    }

    // 7. RENDERIZAÇÃO E FORMATAÇÃO VISUAL
    function renderMessage(role, content, isBot = false) {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'message-row';

      const roleDiv = document.createElement('div');
      roleDiv.className = 'message-role';
      roleDiv.innerText = role;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      
      // Processa Markdown se for o bot, senão exibe como texto normal
      if (isBot) {
        contentDiv.innerHTML = parseMarkdown(content);
      } else {
        contentDiv.innerText = content;
      }

      rowDiv.appendChild(roleDiv);
      rowDiv.appendChild(contentDiv);
      DOM.chatArea.appendChild(rowDiv);

      scrollToBottom();
    }

    // Analisador de Markdown personalizado para blocos de código
    function parseMarkdown(text) {
      // 1. Escapar HTML para segurança
      let html = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // 2. Formatador de Bloco de Código (com botão de copiar)
      const codeBlockRegex = /```(\w+)?\n([\s\S]*?)```/g;
      html = html.replace(codeBlockRegex, (match, language, code) => {
        const langClass = language ? `class="language-${language}"` : '';
        const cleanCode = code.trim();
        return `
          <div style="position: relative;">
            <button class="copy-btn" data-code="${encodeURIComponent(cleanCode)}">Copiar</button>
            <pre><code ${langClass}>${cleanCode}</code></pre>
          </div>
        `;
      });

      // 3. Formatador de Código Inline
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // 4. Quebras de linha fora do código
      html = html.replace(/\n/g, "<br>");
      
      // Correção de bugs visuais de <br> duplos no HTML
      return html.replace(/(<br>\s*){2,}/g, '<br><br>');
    }

    // 8. UTILITÁRIOS INTERNOS
    function setTypingStatus(isTyping) {
      DOM.typing.style.display = isTyping ? 'block' : 'none';
      if(isTyping) scrollToBottom();
    }

    function scrollToBottom() {
      DOM.chatArea.scrollTop = DOM.chatArea.scrollHeight;
    }

    function copyToClipboard(buttonElement) {
      const codeRaw = decodeURIComponent(buttonElement.getAttribute('data-code'));
      
      navigator.clipboard.writeText(codeRaw).then(() => {
        const originalText = buttonElement.innerText;
        buttonElement.innerText = 'Copiado!';
        buttonElement.style.color = '#fff';
        
        setTimeout(() => {
          buttonElement.innerText = originalText;
          buttonElement.style.color = '#888';
        }, 2000);
      }).catch(err => {
        console.error('Falha ao copiar:', err);
      });
    }

    // Boot
    init();
  </script>
</body>
  </html>
